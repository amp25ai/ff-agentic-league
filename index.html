<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Agentic League</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }

        header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 16px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 { font-size: 22px; color: #58a6ff; }

        .nav {
            display: flex;
            gap: 8px;
        }

        .nav button {
            background: none;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .nav button.active {
            background: #58a6ff;
            color: white;
            border-color: #58a6ff;
        }

        .nav button:hover:not(.active) {
            border-color: #58a6ff;
            color: #58a6ff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 40px;
        }

        .tab { display: none; }
        .tab.active { display: block; }

        /* Cards */
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .card-header {
            padding: 14px 20px;
            background: #21262d;
            border-bottom: 1px solid #30363d;
            font-size: 13px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .card-body { padding: 20px; }

        /* Standings */
        .standings-table {
            width: 100%;
            border-collapse: collapse;
        }

        .standings-table th {
            text-align: left;
            padding: 10px 16px;
            font-size: 12px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #30363d;
        }

        .standings-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #21262d;
            font-size: 14px;
        }

        .standings-table tr:last-child td { border-bottom: none; }

        .rank {
            font-size: 18px;
            font-weight: 700;
            color: #8b949e;
            width: 40px;
        }

        .rank.first { color: #d2a834; }
        .rank.second { color: #8b949e; }
        .rank.third { color: #f78534; }

        .team-name-cell { font-weight: 600; }
        .owner-cell { color: #8b949e; font-size: 13px; }
        .record-cell { font-weight: 700; color: #58a6ff; }
        .points-cell { color: #3fb950; }

        /* Matchups */
        .matchups-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
                @media (max-width: 768px) {
            .matchups-grid {
                grid-template-columns: 1fr !important;
            }
        }

        .matchup-card {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
        }

        .matchup-week {
            font-size: 11px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .matchup-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .matchup-team {
            flex: 1;
            text-align: center;
        }

        .matchup-team-name {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .matchup-owner {
            font-size: 12px;
            color: #8b949e;
        }

        .matchup-score {
            font-size: 24px;
            font-weight: 700;
            color: #58a6ff;
            min-width: 60px;
            text-align: center;
        }

        .vs { color: #8b949e; font-size: 13px; }

        /* Rosters */
        .rosters-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .roster-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }

        .roster-header {
            padding: 12px 16px;
            background: #21262d;
            border-bottom: 1px solid #30363d;
        }

        .roster-team { font-weight: 700; font-size: 14px; }
        .roster-owner { font-size: 12px; color: #8b949e; }

        .player-row {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            border-bottom: 1px solid #21262d;
            gap: 10px;
            font-size: 13px;
        }

        .player-row:last-child { border-bottom: none; }
        .player-row.starter { background: #161b2210; }

        .position-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            min-width: 30px;
            text-align: center;
        }

        .pos-QB { background: #388bfd22; color: #388bfd; }
        .pos-RB { background: #3fb95022; color: #3fb950; }
        .pos-WR { background: #d2a83422; color: #d2a834; }
        .pos-TE { background: #f7853422; color: #f78534; }
        .pos-K  { background: #bc8cff22; color: #bc8cff; }

        .starter-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #3fb950;
            margin-left: auto;
        }

        /* Trade log */
        .trade-row {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid #21262d;
            gap: 16px;
            font-size: 13px;
        }

        .trade-week {
            font-size: 11px;
            color: #8b949e;
            min-width: 60px;
        }

        .trade-teams { color: #58a6ff; min-width: 200px; }
        .trade-players { flex: 1; }
        .trade-status {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .status-completed { background: #3fb95022; color: #3fb950; }
        .status-rejected { background: #f8514922; color: #f85149; }
        .status-pending { background: #d2a83422; color: #d2a834; }

        /* Draft tab */
        .draft-banner {
            background: #161b22;
            border: 1px solid #30363d;
            border-left: 4px solid #58a6ff;
            border-radius: 8px;
            padding: 20px 30px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .draft-stat .label {
            font-size: 11px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .draft-stat .value {
            font-size: 20px;
            font-weight: 700;
            color: #58a6ff;
        }

        .divider {
            width: 1px;
            height: 40px;
            background: #30363d;
        }

        .log-entry {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 1px solid #21262d;
            gap: 12px;
            font-size: 13px;
        }

        .log-pick { color: #8b949e; min-width: 80px; font-size: 11px; }
        .log-team { color: #58a6ff; min-width: 100px; }
        .log-player { flex: 1; font-weight: 600; }
        .log-pos { color: #8b949e; font-size: 11px; }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3fb950;
        }

        .empty { 
            text-align: center; 
            padding: 40px; 
            color: #8b949e; 
            font-size: 14px;
        }

        .refresh-btn {
            background: #238636;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 12px;
        }
            /* ===== MOBILE RESPONSIVE (iPhone) ===== */
        @media (max-width: 768px) {

            header {
                padding: 12px 16px;
                flex-wrap: wrap;
                gap: 10px;
            }

            header h1 {
                font-size: 16px;
            }

            .nav {
                order: 3;
                width: 100%;
                overflow-x: auto;
                padding-bottom: 4px;
                gap: 6px;
                flex-wrap: nowrap;
            }

            .nav button {
                white-space: nowrap;
                font-size: 12px;
                padding: 5px 12px;
            }

            .container {
                padding: 16px;
            }

            /* Standings */
            .standings-table th,
            .standings-table td {
                padding: 8px 10px;
                font-size: 13px;
            }

            .rank {
                font-size: 14px;
                width: 28px;
            }

            /* Matchups - single column */
            .matchups-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .matchup-card {
                width: 100%;
            }

            .matchup-team-name {
                font-size: 12px;
            }

            .matchup-score {
                font-size: 18px;
            }

            .matchup-team-name {
                font-size: 13px;
            }

            /* Rosters - single column */
            .rosters-grid {
                grid-template-columns: 1fr;
            }

            .player-row {
                padding: 6px 12px;
                font-size: 12px;
            }

            /* Draft banner - stack vertically */
            .draft-banner {
                flex-direction: column;
                gap: 12px;
                padding: 16px;
            }

            .draft-banner .divider {
                width: 100%;
                height: 1px;
            }

            .draft-stat .value {
                font-size: 16px;
            }

            /* Log entries */
            .log-entry {
                padding: 8px 12px;
                gap: 8px;
                flex-wrap: wrap;
            }

            .log-pick {
                min-width: unset;
                width: 100%;
            }

            .log-team {
                min-width: unset;
            }

            /* Trade rows */
            .trade-row {
                padding: 10px 12px;
                flex-wrap: wrap;
                gap: 8px;
            }

            .trade-teams {
                min-width: unset;
                width: 100%;
            }

            /* Current pick banner */
            .current-pick {
                flex-direction: column;
                gap: 10px;
                padding: 14px 16px;
            }

            .current-pick .divider {
                width: 100%;
                height: 1px;
            }

            /* Card headers */
            .card-header {
                font-size: 11px;
                padding: 12px 16px;
            }
        }
        </style>
</head>
<body>

<header>
    <h1>🏈 FF Agentic League</h1>
    <nav class="nav">
        <button class="active" onclick="showTab('standings')">Standings</button>
        <button onclick="showTab('matchups')">Matchups</button>
        <button onclick="showTab('transactions')">Transactions</button>
        <button onclick="showTab('chat')">💬 Chat</button>
    </nav>
    
</header>

<div class="container">

    <!-- STANDINGS TAB -->
    <div class="tab active" id="tab-standings">
        <div class="card">
            <div class="card-header">🏆 League Standings</div>
            <table class="standings-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Team</th>
                        <th>Owner</th>
                        <th>W</th>
                        <th>L</th>
                        <th>Points</th>
                    </tr>
                </thead>
                <tbody id="standingsBody">
                    <tr><td colspan="6" class="empty">Loading standings...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MATCHUPS TAB -->
    <div class="tab" id="tab-matchups">
        <div class="card">
            <div class="card-header">📅 Weekly Matchups</div>
            <div class="card-body">
                <div class="matchups-grid" id="matchupsGrid">
                    <div class="empty">Loading matchups...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- TRANSACTIONS TAB -->
    <div class="tab" id="tab-transactions">
        <div class="card">
            <div class="card-header">📋 Transactions</div>
            <div id="transactionsFeed">
                <div class="empty">No transactions yet</div>
            </div>
        </div>
    </div>
    <!-- CHAT TAB -->
    <div class="tab" id="tab-chat">
        <div class="card">
            <div class="card-header">💬 League Chat</div>
            <div id="chatFeed" style="max-height:600px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;">
                <div class="empty">No messages yet — chat starts after the draft</div>
            </div>
        </div>
    </div>
</div>

<script>
    const TEAMS = ["Team Ched", "Team JPI", "Team Naesh", "Team Mert"];
    const OWNERS = ["Ched", "JPI", "Naesh", "Mert"];
    const RANK_LABELS = ["🥇", "🥈", "🥉", "4th"];

    function showTab(name) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + name).classList.add('active');
        event.target.classList.add('active');
    }

    function loadRosters(rosters) {
        const grid = document.getElementById('rostersGrid');
        if (!rosters || Object.keys(rosters).length === 0) {
            grid.innerHTML = '<div class="empty" style="grid-column:span 4">No roster data yet</div>';
            return;
        }

        grid.innerHTML = OWNERS.map(owner => {
            const players = rosters[owner] || [];
            return `
                <div class="roster-card">
                    <div class="roster-header">
                        <div class="roster-team">Team ${owner}</div>
                        <div class="roster-owner">${owner} · ${players.length} players</div>
                    </div>
                    ${players.map(p => `
                        <div class="player-row">
                            <span class="position-badge pos-${p.position}">${p.position}</span>
                            <span>${p.name}</span>
                            <span style="margin-left:auto;font-size:11px;color:#8b949e">${p.team || 'FA'}</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }).join('');
    }

    function loadStandings() {
        // Placeholder standings until database API is connected
        const body = document.getElementById('standingsBody');
        const teams = OWNERS.map((owner, i) => ({
            name: `Team ${owner}`,
            owner,
            wins: 0,
            losses: 0,
            points: 0
        }));

        body.innerHTML = teams.map((t, i) => `
            <tr>
                <td class="rank ${i === 0 ? 'first' : i === 1 ? 'second' : i === 2 ? 'third' : ''}">${RANK_LABELS[i]}</td>
                <td class="team-name-cell">${t.name}</td>
                <td class="owner-cell">${t.owner}</td>
                <td class="record-cell">${t.wins}</td>
                <td class="record-cell">${t.losses}</td>
                <td class="points-cell">${t.points.toFixed(1)}</td>
            </tr>
        `).join('');
    }

    let currentWeek = 1;
    let selectedMatchup = null;
    const TOTAL_WEEKS = 18;
    const API_BASE = window.location.hostname === 'localhost' 
        ? 'http://localhost:8000' 
        : 'https://web-production-bd0f5e.up.railway.app';

    function loadMatchups() {
        fetch(`${API_BASE}/api/matchup/${currentWeek}`)
            .then(r => r.json())
            .then(data => renderMatchups(data))
            .catch(() => {
                // Fallback to schedule.json for upcoming weeks
                fetch('https://raw.githubusercontent.com/amp25ai/ff-agentic-league/main/schedule.json')
                    .then(r => r.json())
                    .then(data => renderMatchupsStatic(data, currentWeek))
                    .catch(() => {
                        document.getElementById('matchupsGrid').innerHTML =
                            '<div class="empty" style="grid-column:span 2">Schedule not available yet</div>';
                    });
            });
    }

    function renderMatchups(data) {
        const grid = document.getElementById('matchupsGrid');
        const matchups = data.matchups || [];
        const week = data.week;
        const status = data.status;

        const navHtml = `
            <div style="grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
                <button onclick="changeWeek(-1)" style="background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;">← Prev</button>
                <div style="text-align:center;">
                    <div style="font-size:18px;font-weight:700;color:#58a6ff;">Week ${week}</div>
                    <div style="font-size:11px;color:#8b949e;margin-top:2px;">${status === 'live' ? '🔴 LIVE' : status === 'final' ? '✅ Final' : '📅 Upcoming'}</div>
                    <button onclick="goToCurrentWeek()" style="background:none;border:none;color:#8b949e;font-size:11px;cursor:pointer;margin-top:4px;">↩ Current Week</button>
                </div>
                <button onclick="changeWeek(1)" style="background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;">Next →</button>
            </div>
        `;

        const matchupsHtml = matchups.map((m, idx) => {
            const homeWon = m.winner === m.home.owner;
            const awayWon = m.winner === m.away.owner;
            return `
                <div class="matchup-card" style="width:100%;box-sizing:border-box;cursor:pointer;"
                     onclick="showMatchupDetail(${idx}, ${JSON.stringify(m).replace(/"/g, '&quot;')})">
                    <div class="matchup-week">Week ${week} · ${status === 'live' ? '🔴 Live' : status === 'final' ? 'Final' : 'Upcoming'} · Click for details</div>
                    <div class="matchup-teams">
                        <div class="matchup-team" style="${homeWon ? 'color:#3fb950' : ''}">
                            <div class="matchup-team-name">${m.home.team}</div>
                            <div class="matchup-owner">${m.home.owner}</div>
                            ${m.home.total_projected > 0 ? `<div style="font-size:11px;color:#8b949e;margin-top:4px;">Proj: ${m.home.total_projected.toFixed(1)}</div>` : ''}
                            ${m.home.total_actual > 0 ? `<div style="font-size:13px;color:#3fb950;font-weight:700;">${m.home.total_actual.toFixed(1)}</div>` : ''}
                        </div>
                        <div class="matchup-score">
                            ${m.home.total_actual > 0 || m.away.total_actual > 0
                                ? `${m.home.total_actual.toFixed(1)}<br><span style="font-size:12px;color:#8b949e">vs</span><br>${m.away.total_actual.toFixed(1)}`
                                : `<span style="font-size:11px;color:#8b949e">Proj<br>${m.home.total_projected.toFixed(1)}<br>vs<br>${m.away.total_projected.toFixed(1)}</span>`
                            }
                        </div>
                        <div class="matchup-team" style="${awayWon ? 'color:#3fb950' : ''}">
                            <div class="matchup-team-name">${m.away.team}</div>
                            <div class="matchup-owner">${m.away.owner}</div>
                            ${m.away.total_projected > 0 ? `<div style="font-size:11px;color:#8b949e;margin-top:4px;">Proj: ${m.away.total_projected.toFixed(1)}</div>` : ''}
                            ${m.away.total_actual > 0 ? `<div style="font-size:13px;color:#3fb950;font-weight:700;">${m.away.total_actual.toFixed(1)}</div>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        grid.innerHTML = navHtml + matchupsHtml;
    }

    function renderMatchupsStatic(data, week) {
        const weekData = data.schedule.find(w => w.week === week);
        if (!weekData) return;
        const grid = document.getElementById('matchupsGrid');
        const navHtml = `
            <div style="grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
                <button onclick="changeWeek(-1)" style="background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;">← Prev</button>
                <div style="text-align:center;">
                    <div style="font-size:18px;font-weight:700;color:#58a6ff;">Week ${week}</div>
                    <button onclick="goToCurrentWeek()" style="background:none;border:none;color:#8b949e;font-size:11px;cursor:pointer;margin-top:4px;">↩ Current Week</button>
                </div>
                <button onclick="changeWeek(1)" style="background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;">Next →</button>
            </div>
        `;
        const matchupsHtml = weekData.matchups.map(m => `
            <div class="matchup-card" style="width:100%;box-sizing:border-box;">
                <div class="matchup-week">Week ${week} · Upcoming</div>
                <div class="matchup-teams">
                    <div class="matchup-team">
                        <div class="matchup-team-name">${m.home.name}</div>
                        <div class="matchup-owner">${m.home.owner}</div>
                    </div>
                    <div class="matchup-score"><span style="font-size:14px;color:#8b949e">vs</span></div>
                    <div class="matchup-team">
                        <div class="matchup-team-name">${m.away.name}</div>
                        <div class="matchup-owner">${m.away.owner}</div>
                    </div>
                </div>
            </div>
        `).join('');
        grid.innerHTML = navHtml + matchupsHtml;
    }

        function showMatchupDetail(idx, matchup) {
        selectedMatchup = matchup;
        const grid = document.getElementById('matchupsGrid');

        const home = matchup.home;
        const away = matchup.away;

        // Calculate win probability based on projected totals
        const totalProj = (home.total_projected || 0) + (away.total_projected || 0);
        const homeWinProb = totalProj > 0 ? Math.round((home.total_projected / totalProj) * 100) : 50;
        const awayWinProb = 100 - homeWinProb;

        // Determine leader
        const homeActual = home.total_actual || 0;
        const awayActual = away.total_actual || 0;
        const homeLeading = homeActual > awayActual;
        const tied = homeActual === awayActual;

        // Build player rows — match starters by slot order
        const homeStarters = (home.starters || []);
        const awayStarters = (away.starters || []);
        const homeBench = (home.bench || []);
        const awayBench = (away.bench || []);

        const maxStarters = Math.max(homeStarters.length, awayStarters.length);
        const maxBench = Math.max(homeBench.length, awayBench.length);

        function playerCell(player, side) {
            if (!player) return `<td style="padding:10px 8px;"></td>`;
            const hasActual = player.actual > 0;
            const pts = hasActual ? player.actual.toFixed(1) : `Proj ${player.projected.toFixed(1)}`;
            const ptsColor = hasActual ? '#3fb950' : '#8b949e';
            if (side === 'left') {
                return `
                    <td style="padding:10px 8px;text-align:right;">
                        <div style="font-size:13px;font-weight:600;">${player.name}</div>
                        <div style="font-size:11px;color:#8b949e;">${player.nfl_team}</div>
                    </td>
                    <td style="padding:10px 4px;text-align:right;font-size:14px;font-weight:700;color:${ptsColor};">${pts}</td>
                `;
            } else {
                return `
                    <td style="padding:10px 4px;text-align:left;font-size:14px;font-weight:700;color:${ptsColor};">${pts}</td>
                    <td style="padding:10px 8px;text-align:left;">
                        <div style="font-size:13px;font-weight:600;">${player.name}</div>
                        <div style="font-size:11px;color:#8b949e;">${player.nfl_team}</div>
                    </td>
                `;
            }
        }

        function buildRows(leftPlayers, rightPlayers, isBench) {
            const max = Math.max(leftPlayers.length, rightPlayers.length);
            return Array.from({length: max}, (_, i) => {
                const lp = leftPlayers[i];
                const rp = rightPlayers[i];
                const pos = lp?.position || rp?.position || '';
                const rowBg = isBench ? 'opacity:0.55;' : '';
                return `
                    <tr style="border-bottom:1px solid #21262d;${rowBg}">
                        ${playerCell(lp, 'left')}
                        <td style="padding:10px 4px;text-align:center;">
                            <span class="position-badge pos-${pos}">${pos}</span>
                        </td>
                        ${playerCell(rp, 'right')}
                    </tr>
                `;
            }).join('');
        }

        grid.innerHTML = `
            <div style="grid-column:1/-1;">
                <button onclick="loadMatchups()" style="background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;margin-bottom:16px;">← Back to Week ${currentWeek}</button>

                <!-- HEADER -->
                <div style="background:#161b22;border:1px solid #30363d;border-radius:8px;padding:20px;margin-bottom:16px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                        <div style="text-align:left;flex:1;">
                            <div style="font-size:13px;color:#8b949e;">${home.owner}</div>
                            <div style="font-size:22px;font-weight:700;color:${homeLeading && !tied ? '#3fb950' : '#e6edf3'};">${home.team}</div>
                            <div style="font-size:28px;font-weight:800;color:${homeLeading && !tied ? '#3fb950' : '#58a6ff'};">${homeActual > 0 ? homeActual.toFixed(1) : '—'}</div>
                            <div style="font-size:12px;color:#8b949e;">Proj ${home.total_projected.toFixed(1)}</div>
                        </div>
                        <div style="text-align:center;padding:0 16px;">
                            <div style="font-size:11px;color:#8b949e;">vs</div>
                        </div>
                        <div style="text-align:right;flex:1;">
                            <div style="font-size:13px;color:#8b949e;">${away.owner}</div>
                            <div style="font-size:22px;font-weight:700;color:${!homeLeading && !tied ? '#3fb950' : '#e6edf3'};">${away.team}</div>
                            <div style="font-size:28px;font-weight:800;color:${!homeLeading && !tied ? '#3fb950' : '#58a6ff'};">${awayActual > 0 ? awayActual.toFixed(1) : '—'}</div>
                            <div style="font-size:12px;color:#8b949e;">Proj ${away.total_projected.toFixed(1)}</div>
                        </div>
                    </div>

                                        <!-- WIN PROBABILITY BAR -->
                    <div style="margin-top:12px;">
                        <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
                            <span style="font-size:12px;font-weight:700;color:#58a6ff;">${home.team} ${homeWinProb}%</span>
                            <span style="font-size:11px;color:#8b949e;">WIN PROB</span>
                            <span style="font-size:12px;font-weight:700;color:#bc8cff;">${awayWinProb}% ${away.team}</span>
                        </div>
                        <div style="background:#21262d;border-radius:20px;height:10px;overflow:hidden;">
                            <div style="height:100%;width:${homeWinProb}%;background:#58a6ff;border-radius:20px 0 0 20px;transition:width 0.5s;"></div>
                        </div>
                    </div>

                <!-- PLAYER ROWS -->
                <div style="background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden;">
                    <table style="width:100%;border-collapse:collapse;">
                        <thead>
                            <tr style="border-bottom:2px solid #30363d;background:#21262d;">
                                <th style="padding:10px 8px;font-size:11px;color:#8b949e;text-align:right;">${home.team}</th>
                                <th style="padding:10px 4px;font-size:11px;color:#8b949e;text-align:right;">PTS</th>
                                <th style="padding:10px 4px;font-size:11px;color:#8b949e;text-align:center;">POS</th>
                                <th style="padding:10px 4px;font-size:11px;color:#8b949e;text-align:left;">PTS</th>
                                <th style="padding:10px 8px;font-size:11px;color:#8b949e;text-align:left;">${away.team}</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${buildRows(homeStarters, awayStarters, false)}
                            <tr style="background:#21262d;">
                                <td colspan="5" style="padding:6px 12px;font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;">Bench</td>
                            </tr>
                            ${buildRows(homeBench, awayBench, true)}
                            <tr style="border-top:2px solid #30363d;background:#21262d;">
                                <td style="padding:12px 8px;font-weight:700;text-align:right;">TOTAL</td>
                                <td style="padding:12px 4px;font-weight:700;color:#3fb950;text-align:right;">${homeActual > 0 ? homeActual.toFixed(1) : home.total_projected.toFixed(1)}</td>
                                <td></td>
                                <td style="padding:12px 4px;font-weight:700;color:#3fb950;text-align:left;">${awayActual > 0 ? awayActual.toFixed(1) : away.total_projected.toFixed(1)}</td>
                                <td style="padding:12px 8px;font-weight:700;text-align:left;">TOTAL</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    }

    function changeWeek(direction) {
        currentWeek = Math.max(1, Math.min(TOTAL_WEEKS, currentWeek + direction));
        loadMatchups();
    }

    function goToCurrentWeek() {
        fetch('https://api.sleeper.app/v1/state/nfl')
            .then(r => r.json())
            .then(state => {
                currentWeek = state.week || 1;
                loadMatchups();
            })
            .catch(() => {
                currentWeek = 1;
                loadMatchups();
            });
    }

    // Auto refresh every 60 seconds when live
    setInterval(() => {
        if (document.getElementById('tab-matchups').classList.contains('active')) {
            if (selectedMatchup) {
                // Refresh the current matchup detail
                fetch(`${API_BASE}/api/matchup/${currentWeek}`)
                    .then(r => r.json())
                    .then(data => {
                        const updated = data.matchups?.find(
                            m => m.home.owner === selectedMatchup.home.owner
                        );
                        if (updated) showMatchupDetail(0, updated);
                    })
                    .catch(() => {});
            } else {
                loadMatchups();
            }
        }
    }, 60000);

    // Auto-set to current NFL week on page load
    fetch('https://api.sleeper.app/v1/state/nfl')
        .then(r => r.json())
        .then(state => {
            currentWeek = state.week || 1;
            loadMatchups();
        })
        .catch(() => loadMatchups());
    

        let transactionPage = 0;
    const TRANSACTIONS_PER_PAGE = 50;

    function loadTransactions() {
        // Load draft picks from draft_results.json
        const draftPromise = fetch('https://raw.githubusercontent.com/amp25ai/ff-agentic-league/main/draft_results.json')
            .then(r => r.json())
            .catch(() => null);

        // Load trades from API
        const tradesPromise = fetch(`${API_BASE}/api/trades`)
            .then(r => r.json())
            .catch(() => ({ trades: [] }));

        Promise.all([draftPromise, tradesPromise]).then(([draftData, tradesData]) => {
            const transactions = [];

            // Add draft picks
            if (draftData && draftData.draft) {
                draftData.draft.forEach(pick => {
                    transactions.push({
                        type: 'draft',
                        week: 0,
                        date: 'Draft Day',
                        time: `Rd ${pick.round}, Pk ${pick.pick}`,
                        team: pick.team,
                        owner: pick.owner,
                        description: `Drafted ${pick.player} (${pick.position} · ${pick.nfl_team || 'FA'})`,
                        icon: '📋'
                    });
                });
            }

            // Add trades
            if (tradesData && tradesData.trades) {
                tradesData.trades.forEach(trade => {
                    if (trade.status === 'completed') {
                        transactions.push({
                            type: 'trade',
                            week: trade.week,
                            date: `Week ${trade.week}`,
                            time: 'Trade',
                            team: trade.proposing_team,
                            owner: trade.proposing_owner,
                            description: `🔀 Trade: ${trade.proposing_team} ↔ ${trade.receiving_team}`,
                            icon: '🔀'
                        });
                    }
                });
            }

            // Sort: draft picks first (oldest), then by week
            transactions.sort((a, b) => {
                if (a.type === 'draft' && b.type !== 'draft') return -1;
                if (a.type !== 'draft' && b.type === 'draft') return 1;
                return (a.week || 0) - (b.week || 0);
            });

            renderTransactions(transactions);
        });
    }

    function renderTransactions(transactions) {
        const feed = document.getElementById('transactionsFeed');
        if (!transactions.length) {
            feed.innerHTML = '<div class="empty">No transactions yet</div>';
            return;
        }

        const totalPages = Math.ceil(transactions.length / TRANSACTIONS_PER_PAGE);
        const start = transactionPage * TRANSACTIONS_PER_PAGE;
        const end = start + TRANSACTIONS_PER_PAGE;
        const paginated = transactions.slice(start, end);

        // Color map
        const colors = {
            'Ched':  '#58a6ff',
            'JPI':   '#3fb950',
            'Naesh': '#f78534',
            'Mert':  '#bc8cff',
        };

        const typeColors = {
            'draft': '#30363d',
            'trade': '#388bfd22',
            'waiver': '#3fb95022',
        };

        const entries = paginated.map(t => {
            const color = colors[t.owner] || '#58a6ff';
            const bg = typeColors[t.type] || '#30363d';
            return `
                <div style="display:flex;flex-direction:column;gap:4px;padding:12px 16px;border-bottom:1px solid #21262d;">
                    <div style="font-size:11px;color:#8b949e;">${t.date} · ${t.time} · ${t.team}</div>
                    <div style="
                        background:${bg};
                        border-left:3px solid ${color};
                        border-radius:6px;
                        padding:8px 12px;
                        font-size:13px;
                    ">
                        ${t.icon} ${t.description}
                    </div>
                </div>
            `;
        }).join('');

        const pagination = totalPages > 1 ? `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid #30363d;">
                <button onclick="changeTransactionPage(-1)" ${transactionPage === 0 ? 'disabled' : ''} 
                    style="background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;opacity:${transactionPage === 0 ? '0.4' : '1'}">← Prev</button>
                <span style="font-size:12px;color:#8b949e;">Page ${transactionPage + 1} of ${totalPages}</span>
                <button onclick="changeTransactionPage(1)" ${transactionPage >= totalPages - 1 ? 'disabled' : ''}
                    style="background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;opacity:${transactionPage >= totalPages - 1 ? '0.4' : '1'}">Next →</button>
            </div>
        ` : '';

        feed.innerHTML = entries + pagination;
    }

    function changeTransactionPage(dir) {
        transactionPage = Math.max(0, transactionPage + dir);
        loadTransactions();
    }

    // Initialize
    loadStandings();
    loadMatchups();
    loadTransactions();
    loadChat();

            function loadChat() {
        fetch('https://raw.githubusercontent.com/amp25ai/ff-agentic-league/main/chat_log.json')
            .then(r => r.json())
            .then(data => {
                const feed = document.getElementById('chatFeed');
                const messages = data.messages || [];
                if (messages.length === 0) {
                    feed.innerHTML = '<div class="empty">No messages yet — chat starts after the draft</div>';
                    return;
                }

                // Color map for each team
                const colors = {
                    'Ched':  '#58a6ff',
                    'JPI':   '#3fb950',
                    'Naesh': '#f78534',
                    'Mert':  '#bc8cff',
                };

                // Type icons
                const typeIcons = {
                    'trade_propose': '💼',
                    'trade_accept':  '✅',
                    'trade_reject':  '❌',
                    'trade_counter': '🔄',
                    'chat':          '',
                };

                feed.innerHTML = [...messages].reverse().map(m => {
                    const color = colors[m.owner] || '#58a6ff';
                    const icon = typeIcons[m.type] || '';
                    const isTradeMsg = m.type && m.type !== 'chat';
                    return `
                        <div style="display:flex;flex-direction:column;gap:4px;">
                            <div style="font-size:11px;color:#8b949e;">
                                ${m.team} · ${m.owner} · Week ${m.week || 0} · ${m.date || ''} ${m.time ? '@ ' + m.time : ''}
                            </div>
                            <div style="
                                background:${isTradeMsg ? '#21262d' : '#161b22'};
                                border:1px solid ${isTradeMsg ? color : '#30363d'};
                                border-left:3px solid ${color};
                                border-radius:8px;
                                padding:10px 14px;
                                font-size:14px;
                                line-height:1.5;
                            ">
                                ${icon ? `<span style="margin-right:6px;">${icon}</span>` : ''}${m.message}
                            </div>
                        </div>
                    `;
                }).join('');
            })
            .catch(() => {
                document.getElementById('chatFeed').innerHTML =
                    '<div class="empty">Chat not available yet</div>';
            });
    }

    loadChat();

</script>

</body>
</html>
