<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Agentic League - Live Draft</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }

        header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 24px;
            color: #58a6ff;
        }

        header span {
            font-size: 14px;
            color: #8b949e;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 40px;
        }

        /* Current pick banner */
        .current-pick {
            background: #161b22;
            border: 1px solid #30363d;
            border-left: 4px solid #58a6ff;
            border-radius: 8px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .current-pick .label {
            font-size: 12px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .current-pick .value {
            font-size: 22px;
            font-weight: 700;
            color: #58a6ff;
        }

        .current-pick .divider {
            width: 1px;
            height: 40px;
            background: #30363d;
        }

        /* Rosters grid */
        .rosters {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .team-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }

        .team-card.active {
            border-color: #58a6ff;
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.15);
        }

        .team-header {
            padding: 14px 16px;
            background: #21262d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .team-name {
            font-weight: 700;
            font-size: 15px;
        }

        .team-owner {
            font-size: 12px;
            color: #8b949e;
        }

        .pick-count {
            font-size: 12px;
            color: #8b949e;
            background: #0d1117;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .player-list {
            padding: 8px 0;
            min-height: 200px;
        }

        .player-row {
            display: flex;
            align-items: center;
            padding: 7px 16px;
            gap: 10px;
            border-bottom: 1px solid #21262d;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .position-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            min-width: 30px;
            text-align: center;
        }

        .pos-QB { background: #388bfd22; color: #388bfd; }
        .pos-RB { background: #3fb95022; color: #3fb950; }
        .pos-WR { background: #d2a83422; color: #d2a834; }
        .pos-TE { background: #f7853422; color: #f78534; }
        .pos-K  { background: #bc8cff22; color: #bc8cff; }

        .player-name {
            font-size: 13px;
            flex: 1;
        }

        .player-team {
            font-size: 11px;
            color: #8b949e;
        }

        /* Draft log */
        .draft-log {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }

        .draft-log h2 {
            padding: 16px 20px;
            font-size: 14px;
            background: #21262d;
            border-bottom: 1px solid #30363d;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .log-entries {
            max-height: 300px;
            overflow-y: auto;
        }

        .log-entry {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 1px solid #21262d;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        .log-pick-num {
            font-size: 11px;
            color: #8b949e;
            min-width: 60px;
        }

        .log-team {
            font-size: 12px;
            color: #58a6ff;
            min-width: 100px;
        }

        .log-player {
            font-size: 13px;
            font-weight: 600;
            flex: 1;
        }

        .log-position {
            font-size: 11px;
            color: #8b949e;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8b949e;
        }

        .empty-state h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #e6edf3;
        }

        .refresh-btn {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 16px;
        }

        .refresh-btn:hover { background: #2ea043; }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3fb950;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

<header>
    <h1>🏈 FF Agentic League — Live Draft</h1>
    <div style="display:flex; align-items:center; gap:10px;">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Loading...</span>
    </div>
</header>

<div class="container">

    <!-- Current pick banner -->
    <div class="current-pick" id="currentPick">
        <div>
            <div class="label">Current Pick</div>
            <div class="value" id="pickNum">—</div>
        </div>
        <div class="divider"></div>
        <div>
            <div class="label">Round</div>
            <div class="value" id="roundNum">—</div>
        </div>
        <div class="divider"></div>
        <div>
            <div class="label">On The Clock</div>
            <div class="value" id="onClock">Waiting for draft...</div>
        </div>
    </div>

    <!-- Team rosters -->
    <div class="rosters" id="rosters">
        <div class="empty-state" style="grid-column: span 4;">
            <h2>Draft hasn't started yet</h2>
            <p>Run <code>python3 draft.py</code> to begin the draft</p>
            <button class="refresh-btn" onclick="loadDraft()">🔄 Refresh</button>
        </div>
    </div>

    <!-- Draft log -->
    <div class="draft-log">
        <h2>📋 Draft Log</h2>
        <div class="log-entries" id="logEntries">
            <div style="text-align:center; padding:30px; color:#8b949e;">
                No picks yet
            </div>
        </div>
    </div>

</div>

<script>
    const TEAMS = ["Team Ched", "Team JPI", "Team Naesh", "Team Mert"];
    const OWNERS = ["Ched", "JPI", "Naesh", "Mert"];

    function getPositionClass(pos) {
        return `pos-${pos}` || 'pos-K';
    }

    function loadDraft() {
        fetch('draft_results.json')
            .then(r => r.json())
            .then(data => renderDraft(data))
            .catch(() => {
                document.getElementById('statusText').textContent = 'No draft data yet';
                document.getElementById('statusDot').style.background = '#8b949e';
            });
    }

    function renderDraft(data) {
        const picks = data.draft || [];
        const rosters = data.rosters || {};

        // Update status
        const totalPicks = 4 * 14;
        const done = picks.length >= totalPicks;
        document.getElementById('statusText').textContent = done ? 'Draft Complete' : `Pick ${picks.length} of ${totalPicks}`;
        document.getElementById('statusDot').style.background = done ? '#3fb950' : '#58a6ff';

        // Current pick info
        if (picks.length > 0 && !done) {
            const last = picks[picks.length - 1];
            document.getElementById('pickNum').textContent = last.overall + 1;
            document.getElementById('roundNum').textContent = last.round;
            document.getElementById('onClock').textContent = '...picking';
        } else if (done) {
            document.getElementById('onClock').textContent = '🏆 Draft Complete!';
            document.getElementById('pickNum').textContent = totalPicks;
            document.getElementById('roundNum').textContent = '14';
        }

        // Render rosters
        const rostersEl = document.getElementById('rosters');
        if (picks.length === 0) return;

        rostersEl.innerHTML = TEAMS.map((team, i) => {
            const owner = OWNERS[i];
            const teamPlayers = rosters[owner] || [];
            const isActive = !done && picks.length > 0 && 
                picks[picks.length-1].overall % 4 === i;

            return `
                <div class="team-card ${isActive ? 'active' : ''}">
                    <div class="team-header">
                        <div>
                            <div class="team-name">${team}</div>
                            <div class="team-owner">${owner}</div>
                        </div>
                        <div class="pick-count">${teamPlayers.length}/14</div>
                    </div>
                    <div class="player-list">
                        ${teamPlayers.length === 0 
                            ? '<div style="text-align:center;padding:20px;color:#8b949e;font-size:13px;">No picks yet</div>'
                            : teamPlayers.map(p => `
                                <div class="player-row">
                                    <span class="position-badge ${getPositionClass(p.position)}">${p.position}</span>
                                    <span class="player-name">${p.name}</span>
                                    <span class="player-team">${p.team || 'FA'}</span>
                                </div>
                            `).join('')
                        }
                    </div>
                </div>
            `;
        }).join('');

        // Render log
        const logEl = document.getElementById('logEntries');
        logEl.innerHTML = [...picks].reverse().map(p => `
            <div class="log-entry">
                <span class="log-pick-num">Rd ${p.round}, Pk ${p.pick}</span>
                <span class="log-team">${p.team}</span>
                <span class="log-player">${p.player}</span>
                <span class="log-position">${p.position} · ${p.nfl_team || 'FA'}</span>
            </div>
        `).join('');
    }

    // Auto refresh every 5 seconds
    loadDraft();
    setInterval(loadDraft, 5000);
</script>

</body>
</html>
