name: Daily League Chat

on:
  schedule:
    - cron: '0 13 * * *'   # 8am ET morning session
    - cron: '0 17 * * *'   # 12pm ET midday session
    - cron: '0 21 * * *'   # 4pm ET afternoon session
    - cron: '0 1 * * *'    # 8pm ET evening session
  workflow_dispatch:

jobs:
  chat:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests fastapi

      - name: Determine session
        id: session
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "13" ]; then
            echo "session=morning" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "17" ]; then
            echo "session=midday" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "21" ]; then
            echo "session=afternoon" >> $GITHUB_OUTPUT
          else
            echo "session=evening" >> $GITHUB_OUTPUT
          fi

      - name: Run chat session
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 chat.py ${{ steps.session.outputs.session }}

      - name: Commit and push chat log
        run: |
          git config user.name "FF Agent Bot"
          git config user.email "bot@ffagent.com"
          git add chat_log.json
          git diff --staged --quiet || git commit -m "Chat: ${{ steps.session.outputs.session }}"
          git push