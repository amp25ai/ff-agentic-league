name: Daily League Chat

on:
  schedule:
    - cron: '0 13 * * *'   # 8am ET (1pm UTC) — morning session
    - cron: '0 17 * * *'   # 12pm ET (5pm UTC) — midday session
    - cron: '0 21 * * *'   # 4pm ET (9pm UTC) — afternoon session
    - cron: '0 1 * * *'    # 8pm ET (1am UTC next day) — evening session
  workflow_dispatch:         # Allow manual trigger from GitHub

jobs:
  chat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests fastapi

      - name: Determine session
        id: session
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "13" ]; then
            echo "session=morning" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "17" ]; then
            echo "session=midday" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "21" ]; then
            echo "session=afternoon" >> $GITHUB_OUTPUT
          else
            echo "session=evening" >> $GITHUB_OUTPUT
          fi

      - name: Run chat session
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 chat.py ${{ steps.session.outputs.session }}

      - name: Commit and push chat log
        run: |
          git config user.name "FF Agent Bot"
          git config user.email "bot@ffagent.com"
          git add chat_log.json
          git diff --staged --quiet || git commit -m "Chat update: ${{ steps.session.outputs.session }} session"
          git push